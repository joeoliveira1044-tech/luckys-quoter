<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lucky's Quotes</title>
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lucky's Quotes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="favicon.png">
<style>
*,*::before,*::after{box-sizing:border-box;border:0 solid #d0d0d0}
html{-webkit-text-size-adjust:100%;line-height:1.4}
body{margin:0;background:#ececec;color:#000;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;-webkit-tap-highlight-color:transparent}
h1,h2,h3,p,ol,ul{margin:0}
button{background:transparent;border:0;padding:0;color:inherit;font:inherit;cursor:pointer;-webkit-appearance:none}
input,select,textarea{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;border-radius:0}
select{background-image:none}
img,svg{display:block}
textarea{resize:vertical}
input[type=checkbox]{-webkit-appearance:auto;appearance:auto}
input[type=date]{min-height:44px}
.flex{display:flex}.grid{display:grid}.block{display:block}
.flex-1{flex:1 1 0%}.flex-col{flex-direction:column}
.items-center{align-items:center}.items-start{align-items:flex-start}.items-end{align-items:flex-end}.items-baseline{align-items:baseline}
.justify-between{justify-content:space-between}.justify-center{justify-content:center}
.gap-1{gap:4px}.gap-2{gap:8px}.gap-3{gap:12px}.gap-4{gap:16px}
.w-full{width:100%}.text-left{text-align:left}.text-right{text-align:right}
.mt-1{margin-top:4px}.mt-2{margin-top:8px}.mt-3{margin-top:12px}.mt-4{margin-top:16px}
.mb-2{margin-bottom:8px}.mb-3{margin-bottom:12px}
.p-3{padding:12px}.p-4{padding:16px}.p-6{padding:24px}.px-4{padding-left:16px;padding-right:16px}.pb-5{padding-bottom:20px}
.bg-white{background:#fff}
@media print{.no-print{display:none!important}body{background:#fff}}
</style>
</head>
<body>
<div id="root"></div>
<noscript>This app needs JavaScript turned on.</noscript>
<script src="app.js"></script>
<script>
if ("serviceWorker" in navigator && location.protocol !== "file:") {
  window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); });
}
</script>
</body>
</html>
